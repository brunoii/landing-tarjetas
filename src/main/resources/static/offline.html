<!doctype html>
<html lang="es-AR">
<head>

    <style>

        h1 { margin-top: 0; }
        p { line-height: 1.6; color: #9ca3af; }
        a { display: inline-flex; margin-top: 0.75rem; color: #7dd3fc; font-weight: 700; }
    </style>

<body>
<main>
    <h1>Sin conexión</h1>
    <p>Esta app solo conserva una copia mínima del shell público para volver a abrir la interfaz base sin guardar datos sensibles.</p>
    <p>Reconectate para recuperar contenido dinámico y acciones protegidas por red.</p>
